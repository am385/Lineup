services:
  lineup:
    image: ${DOCKER_IMAGE:-lineup:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: lineup
    ports:
      # Port variables change only host-facing ports; Lineup uses fixed ports inside the container.
      - "${HTTP_PORT:-8080}:8080"
      # Publish dedicated virtual-output listeners. Override with an equal-sized mapping,
      # for example VIRTUAL_OUTPUT_PORTS=9600-9607:8600-8607 for eight outputs.
      - "${VIRTUAL_OUTPUT_PORTS:-8600-8615:8600-8615}"
      - "${HDHOMERUN_DISCOVERY_PORT:-65001}:65001/udp"
      - "${SSDP_PORT:-1900}:1900/udp"
    volumes:
      # Persist all Lineup-owned application data across container restarts
      - appdata:/appdata
      # Persist XMLTV output across container restarts (optional, only if you use the XMLTV output feature)
      - guide:/guide
      - transient:/transient
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Clear the base image default; Lineup configures explicit Kestrel listeners.
      - ASPNETCORE_HTTP_PORTS=
      - Lineup__AppDataPath=/appdata
      - Lineup__GuideOutputDir=/guide
      - Lineup__TransientPath=/transient
      # Optional vendor-neutral logging target. Keep credentials in the host environment.
      - Lineup__Logging__OpenTelemetry__Endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - Lineup__Logging__OpenTelemetry__Protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:-httpProtobuf}
    # Use host network mode if the HDHomeRun device is on the local network
    # and you need device discovery to work. Otherwise, ensure the device
    # address is set to an IP reachable from the container.
    # network_mode: host
    restart: unless-stopped

volumes:
  appdata:
  guide:
  transient:
